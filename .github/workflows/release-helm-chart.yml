name: Release Helm Chart

# Packages the Helm chart under helm/ and publishes it to GitHub Pages
# (gh-pages branch) using helm/chart-releaser. A GitHub Release is created
# for each new chart version, and index.yaml is updated so the repo can be
# consumed with `helm repo add`.
on:
  push:
    branches:
      - helm-chart-release
    paths:
      - "helm/**"
  workflow_dispatch:

permissions:
  contents: write # create releases and push to gh-pages
  pages: write # publish GitHub Pages

jobs:
  release:
    name: Release Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # ratchet:azure/setup-helm@v4.3.1

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # ratchet:helm/chart-releaser-action@v1.7.0
        with:
          # The chart lives at helm/Chart.yaml, so scan the repo root for
          # top-level directories that contain a chart.
          charts_dir: .
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
